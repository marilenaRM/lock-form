doctrine:
    dbal:
        driver: pdo_sqlite
        path: '%kernel.project_dir%/var/data_%kernel.environment%.db'
    orm:
        enable_lazy_ghost_objects: true
        controller_resolver:
            auto_mapping: false
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
